<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI SOC Assistant</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 760px; margin: 3rem auto; padding: 0 1.25rem; line-height: 1.5; }
    form, pre { border: 1px solid #8886; border-radius: .75rem; padding: 1rem; }
    label { display: block; margin: .75rem 0; }
    input[type="text"] { width: 100%; padding: .65rem; box-sizing: border-box; }
    button { padding: .65rem 1rem; font-weight: 650; }
    pre { min-height: 8rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .warning { border-left: .3rem solid #d97706; padding-left: .8rem; }
  </style>
</head>
<body>
  <main>
    <h1>AI SOC Assistant</h1>
    <p class="warning">
      Educational use only. This tool accepts only loopback or private-network IP
      addresses and requires an explicit authorization confirmation.
    </p>
    <form id="scan-form">
      <label>
        Target IP
        <input id="target" name="target" type="text" value="127.0.0.1" required>
      </label>
      <label>
        <input id="authorized" name="authorized" type="checkbox" required>
        I own this target or have permission to scan it.
      </label>
      <button type="submit">Run limited scan</button>
    </form>
    <h2>Result</h2>
    <pre id="result" aria-live="polite">No scan has run.</pre>
  </main>
  <script>
    const form = document.getElementById("scan-form");
    const result = document.getElementById("result");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.textContent = "Running a limited top-100-port scan...";
      try {
        const response = await fetch("/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            target: document.getElementById("target").value,
            authorized: document.getElementById("authorized").checked
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Scan failed");
        result.textContent = `${data.data}\n\nSource: ${data.source}`;
      } catch (error) {
        result.textContent = `Error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
